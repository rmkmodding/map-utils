name: Release

# Publishes a GitHub Release whenever a version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags:
      - 'v*'

# Required for softprops/action-gh-release to create the release.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release x64)
        run: MSBuild.exe map-utils.sln -v:minimal -m -property:Configuration=Release -property:Platform=x64

      - name: Stage plugin packages
        shell: pwsh
        run: |
          $plugin  = "HardcoreMapAndNavigation"
          $version = "${{ github.ref_name }}"

          # Main package: DLL, laid out to extract into the game root.
          $mainDest = "package/red4ext/plugins/$plugin"
          New-Item -ItemType Directory -Force -Path $mainDest | Out-Null
          Copy-Item "build/release/bin/$plugin.dll" $mainDest
          Compress-Archive -Path "package/*" -DestinationPath "$plugin-$version.zip" -Force

          # Debug symbols package: PDB only, same layout so it drops in beside the DLL.
          $pdbDest = "package-pdb/red4ext/plugins/$plugin"
          New-Item -ItemType Directory -Force -Path $pdbDest | Out-Null
          Copy-Item "build/release/bin/$plugin.pdb" $pdbDest
          Compress-Archive -Path "package-pdb/*" -DestinationPath "${plugin}-${version}_pdb.zip" -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            HardcoreMapAndNavigation-${{ github.ref_name }}.zip
            HardcoreMapAndNavigation-${{ github.ref_name }}_pdb.zip
